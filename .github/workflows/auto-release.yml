name: Auto release

# plugin.json 의 version 이 바뀌면 그 버전으로 태그와 GitHub Release 를 만든다.
#
# 마켓플레이스는 version 이 설정돼 있으면 그 문자열로 플러그인을 핀한다.
# 즉 version 을 올리는 것이 곧 릴리스이므로, 그 시점을 태그·Release 로 남겨
# 레포에서 현재 버전을 바로 확인할 수 있게 한다.
on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']
  workflow_dispatch:   # 기존 버전으로 초기 Release 를 만들 때 수동 실행

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # --generate-notes 와 태그 조회에 전체 히스토리가 필요하다

      - name: Resolve version
        id: v
        run: |
          VERSION=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          if [ -z "$VERSION" ]; then
            echo "plugin.json 에 version 이 없다 — 건너뛴다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # version 은 파일에서 읽은 값이므로 셸에 넘기기 전에 형태를 확인한다.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "version 이 semver 형식이 아니다: $VERSION — 건너뛴다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION 태그가 이미 있다 — 건너뛴다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION 릴리스를 만든다"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
